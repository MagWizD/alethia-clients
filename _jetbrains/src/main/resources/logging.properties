# Alethia logging configuration
# Routes com.alethia.* logs to a dedicated file

# Disable ALL root logging: only Alethia logs should appear
.level=OFF

# File handler configuration
handlers=

# Alethia package: route to file handler
com.alethia.level=ALL
com.alethia.handlers=java.util.logging.FileHandler
com.alethia.useParentHandlers=false

# File handler settings
java.util.logging.FileHandler.pattern=%h/.alethia/alethia.log
java.util.logging.FileHandler.append=true
java.util.logging.FileHandler.formatter=java.util.logging.SimpleFormatter
java.util.logging.FileHandler.level=ALL

# Simple formatter pattern: human readable
# YEAR-MONTH-DAY HOUR-MIN-SEC LOG-LEVEL LOGGER-NAME LOG-CONTENTS
java.util.logging.SimpleFormatter.format=%1$tY-%1$tm-%1$td %1$tH:%1$tM:%1$tS [%4$s] %2$s - %5$s%n